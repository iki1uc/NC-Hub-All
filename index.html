<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POT · ohne Regeln</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a0f;
    color: #d0d0e0;
    font-family: 'Georgia', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    flex-direction: column;
  }
  .kern {
    max-width: 700px;
    width: 100%;
    background: #12121a;
    border: 1px solid #2a2a3a;
    border-radius: 40px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 0 80px rgba(200,180,100,0.02);
    transition: all 0.3s;
  }
  .kern:hover {
    border-color: #4a4a5a;
  }
  h1 {
    font-size: 2.8rem;
    font-weight: 300;
    letter-spacing: 6px;
    color: #c0b090;
    margin-bottom: 10px;
  }
  .sub {
    font-size: 0.8rem;
    color: #5a5a6a;
    letter-spacing: 3px;
    margin-bottom: 30px;
  }
  .ausgabe {
    background: #0a0a10;
    border-left: 2px solid #4a4a5a;
    padding: 18px 20px;
    font-size: 0.8rem;
    white-space: pre-wrap;
    font-family: 'Courier New', monospace;
    color: #b0b0c0;
    border-radius: 8px;
    margin: 20px 0 30px 0;
    min-height: 70px;
    text-align: left;
  }
  .aktion {
    background: transparent;
    border: 1px solid #4a4a5a;
    color: #c0b090;
    padding: 10px 30px;
    border-radius: 40px;
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .aktion:hover {
    background: #2a2a3a;
    border-color: #c0b090;
    box-shadow: 0 0 40px rgba(200,180,100,0.03);
  }
  .fuss {
    margin-top: 25px;
    font-size: 0.6rem;
    color: #3a3a4a;
    letter-spacing: 2px;
  }
  .fuss span { color: #5a5a6a; }
</style>
</head>
<body>

<div class="kern">

  <h1>⚡ POT</h1>
  <div class="sub">ohne Regeln · mit Gedanke · für dich</div>

  <div class="ausgabe" id="ausgabe">✦ bereit · leise · offen</div>

  <button class="aktion" id="aktionBtn">✦ einen Gedanken kristallisieren</button>

  <div class="fuss">
    <span>🧩</span> DA · NE · BEN · 6D · wieimmer4u
  </div>

</div>

<script>
// ─── POT – ohne Regeln ────────────────────────────
const POT = {

  P: (wert) => ({ primär: wert, status: 'frei' }),
  O: (sache) => ({ sache, verordnet: true }),
  T: (zahlen) => ({
    verbindung: 'all4all',
    balance: (zahlen.reduce((a,b) => a+b, 0) / zahlen.length).toFixed(2)
  }),

  D6: () => ({
    höhe: 'Caelum',
    breite: 'Terra',
    tiefe: 'Mare',
    mysteryHöhe: 'Aether',
    mysteryBreite: 'Fatum',
    mysteryTiefe: 'Tempus'
  }),

  kristall: (impuls) => {
    return {
      gedanke: impuls,
      primär: POT.P(impuls),
      ordert: POT.O('Axiom'),
      tele: POT.T([3,9,27,81]),
      d6: POT.D6(),
      stamp: Date.now()
    };
  }
};

// ─── DOM ──────────────────────────────────────────────
const ausgabe = document.getElementById('ausgabe');
const aktionBtn = document.getElementById('aktionBtn');

function show() {
  const impulse = ['81', '243', '2268', '641', 'POT', 'Cubik', 'Romanum'];
  const wahl = impulse[Math.floor(Math.random() * impulse.length)];
  const ergebnis = POT.kristall(wahl);
  ausgabe.textContent = JSON.stringify(ergebnis, null, 2);
}

aktionBtn.addEventListener('click', show);
setTimeout(show, 300);
</script>

</body>
</html>
