<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>NC‑Hub‑All – Master Hub</title>

    <style>
        body { font-family: Arial; background:#0d0d0d; color:#e6e6e6; padding:20px; }
        h1 { color:#4af; }
        .box {
            margin-top:25px; padding:20px; background:#111;
            border-left:4px solid #4af; border-radius:8px;
        }
        pre {
            background:#000; padding:15px; border-radius:8px;
            border:1px solid #333; white-space:pre-wrap;
        }
    </style>
</head>

<body>
    <h1>NC‑Hub‑All – OCTA Master Hub</h1>

    <div id="dashboard" class="box"></div>
    <div id="monitor" class="box"></div>
    <div id="loader" class="box"></div>
    <div id="api" class="box"></div>

    <script>
        /* -----------------------------------------
           NC‑Hub‑All MODULE‑REGISTRY (Master‑Hub)
        ----------------------------------------- */
        const NCHUB = {
            modules: {},

            register(name, data) {
                this.modules[name] = data;
            },

            list() {
                return Object.keys(this.modules);
            }
        };

        /* -----------------------------------------
           DASHBOARD (keine extra Datei)
        ----------------------------------------- */
        function loadDashboard() {
            const el = document.getElementById("dashboard");
            el.innerHTML = `
                <h2>Dashboard</h2>
                <p>Registrierte Module:</p>
                <pre>${JSON.stringify(NCHUB.modules, null, 4)}</pre>
                <p>System‑Übersicht aktiv.</p>
            `;
        }

        /* -----------------------------------------
           SYSTEM‑MONITOR (keine extra Datei)
        ----------------------------------------- */
        function loadMonitor() {
            const el = document.getElementById("monitor");
            el.innerHTML = `
                <h2>System‑Monitor</h2>
                <p>Status: ${navigator.onLine ? "Online" : "Offline"}</p>
                <p>Verbindung: LAN / WLAN / WAN</p>
                <p>Zeit: ${new Date().toLocaleString()}</p>
                <p>Module geladen: ${NCHUB.list().length}</p>
            `;
        }

        /* -----------------------------------------
           MODULE‑LOADER (keine extra Datei)
        ----------------------------------------- */
        function loadModuleLoader() {
            const el = document.getElementById("loader");
            el.innerHTML = `
                <h2>Module‑Loader</h2>
                <p>Der Hub lädt Module dynamisch.</p>
                <p>Aktuelle Module:</p>
                <pre>${JSON.stringify(NCHUB.list(), null, 4)}</pre>
            `;
        }

        /* -----------------------------------------
           API‑LAYER (keine extra Datei)
        ----------------------------------------- */
        const NCHUB_API = {
            get(name) {
                return NCHUB.modules[name] || null;
            },
            all() {
                return NCHUB.modules;
            }
        };

        function loadAPI() {
            const el = document.getElementById("api");
            el.innerHTML = `
                <h2>API‑Layer</h2>
                <p>API bereit:</p>
                <pre>${JSON.stringify(NCHUB_API.all(), null, 4)}</pre>
            `;
        }

        /* -----------------------------------------
           DEMO‑REGISTRIERUNG (leicht, modular)
        ----------------------------------------- */
        NCHUB.register("POOL", { typ: "Datenquelle", version: "1.0" });
        NCHUB.register("DR", { typ: "Router", version: "1.0" });
        NCHUB.register("NET", { typ: "Netzwerk", version: "1.0" });
        NCHUB.register("AXO", { typ: "Operator", version: "1.0" });
        NCHUB.register("ID", { typ: "Identität", version: "1.0" });

        /* -----------------------------------------
           INITIAL LOAD
        ----------------------------------------- */
        loadDashboard();
        loadMonitor();
        loadModuleLoader();
        loadAPI();

        window.addEventListener("online", loadMonitor);
        window.addEventListener("offline", loadMonitor);
    </script>

</body>
</html>
