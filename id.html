<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>NC‑Hub‑All – ID Viewer</title>

    <style>
        body {
            font-family: Arial;
            background:#0d0d0d;
            color:#e6e6e6;
            padding:20px;
        }
        h1 { color:#4af; }
        #hub-info {
            margin-top:20px;
            font-size:18px;
            padding:15px;
            background:#000;
            border:1px solid #333;
            border-radius:8px;
            white-space:pre-wrap;
        }
        .module-box {
            margin-top:30px;
            padding:20px;
            background:#111;
            border-left:4px solid #4af;
            border-radius:8px;
        }
    </style>
</head>

<body>
    <h1>NC‑Hub‑All – ID Viewer</h1>

    <p>Zeigt die registrierten Module des Master‑Hubs.</p>

    <div id="hub-info">Noch keine Daten geladen.</div>

    <div id="hub-status" class="module-box"></div>

    <script src="NCregister.js"></script>
    <script src="NCmap.js"></script>

    <script>
        // Anzeige der Hub‑Daten
        function showHub() {
            const info = JSON.stringify(NCregister.modules, null, 4);
            document.getElementById("hub-info").innerText = info;
        }

        // Hub‑Status
        function hubStatus() {
            const el = document.getElementById("hub-status");
            el.innerHTML = `
                <h2>Hub‑Status</h2>
                <p>Online: ${navigator.onLine ? "Ja" : "Nein"}</p>
                <p>Registrierte Module: ${Object.keys(NCregister.modules).length}</p>
                <p>Master‑Hub aktiv.</p>
            `;
        }

        // Initial laden
        showHub();
        hubStatus();

        // Online/Offline‑Events
        window.addEventListener("online", hubStatus);
        window.addEventListener("offline", hubStatus);
    </script>

</body>
</html>
